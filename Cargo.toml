[package]
name = "thalovant"
version = "0.2.23"
edition = "2021"
description = "Rust SDK for direct Thalovant hub data-plane clients and agents"
readme = "README.md"
license = "MIT"
repository = "https://github.com/thalovant/thalovant-rust-sdk"
homepage = "https://docs.thalovant.com/developers/sdks/rust/"
documentation = "https://docs.rs/thalovant"
keywords = ["thalovant", "sdk", "agent", "voice", "assistant"]
categories = ["api-bindings", "network-programming"]
rust-version = "1.75"

[dependencies]
aes-gcm = "0.10"
base64 = "0.23"
futures-util = { version = "0.3", features = ["sink"] }
flate2 = "1"
hex = "0.4"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rumqttc = { version = "0.25.1", default-features = false, features = ["use-native-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
url = "2"
urlencoding = "2"
uuid = { version = "1", features = ["v4", "fast-rng"] }
