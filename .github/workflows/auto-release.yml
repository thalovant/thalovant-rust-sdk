name: Auto Release

on:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  id-token: write

concurrency:
  group: auto-release-rust-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release unpublished version
    runs-on: ubuntu-latest
    environment:
      name: crates
      url: https://crates.io/crates/thalovant
    env:
      CARGO_REGISTRY_TOKEN_FROM_SECRET: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Read package version
        id: version
        run: |
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check existing tag
        id: tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check formatting
        if: steps.tag.outputs.exists == 'false'
        run: cargo fmt --check

      - name: Run clippy
        if: steps.tag.outputs.exists == 'false'
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        if: steps.tag.outputs.exists == 'false'
        run: cargo test --all-features

      - name: Check package contents
        if: steps.tag.outputs.exists == 'false'
        run: cargo package --allow-dirty --list

      - name: Check whether version is already on crates.io
        if: steps.tag.outputs.exists == 'false'
        id: registry
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          STATUS="$(curl -sS -o /dev/null -w '%{http_code}' -A 'thalovant-release-check' "https://crates.io/api/v1/crates/thalovant/$PACKAGE_VERSION")"
          case "$STATUS" in
            200) echo "exists=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "exists=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "Unexpected crates.io status: $STATUS"; exit 1 ;;
          esac

      - name: Publish skipped
        if: steps.tag.outputs.exists == 'false' && steps.registry.outputs.exists == 'true'
        run: echo "thalovant ${{ steps.version.outputs.version }} is already published on crates.io."

      - name: Authenticate with crates.io trusted publishing
        if: ${{ steps.tag.outputs.exists == 'false' && steps.registry.outputs.exists == 'false' && env.CARGO_REGISTRY_TOKEN_FROM_SECRET == '' }}
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish to crates.io dry run
        if: steps.tag.outputs.exists == 'false' && steps.registry.outputs.exists == 'false'
        run: cargo publish --dry-run
        env:
          CARGO_REGISTRY_TOKEN: ${{ env.CARGO_REGISTRY_TOKEN_FROM_SECRET || steps.crates-auth.outputs.token }}

      - name: Publish to crates.io
        if: steps.tag.outputs.exists == 'false' && steps.registry.outputs.exists == 'false'
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ env.CARGO_REGISTRY_TOKEN_FROM_SECRET || steps.crates-auth.outputs.token }}

      - name: Verify crates.io version
        if: steps.tag.outputs.exists == 'false'
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          for attempt in $(seq 1 12); do
            STATUS="$(curl -sS -o /dev/null -w '%{http_code}' -A 'thalovant-release-check' "https://crates.io/api/v1/crates/thalovant/$PACKAGE_VERSION")"
            if [ "$STATUS" = "200" ]; then
              echo "Verified thalovant $PACKAGE_VERSION on crates.io."
              exit 0
            fi
            sleep 10
          done
          echo "thalovant $PACKAGE_VERSION was not visible on crates.io after waiting."
          exit 1

      - name: Create GitHub release
        if: steps.tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes "Release $TAG"
