name: Published crate smoke

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published crates.io version to verify
        required: true
        default: 0.2.17

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - name: Resolve the immutable crate and compile a clean consumer
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
        run: |
          cargo add --manifest-path smoke/published/Cargo.toml "thalovant@=$PACKAGE_VERSION"
          cargo check --manifest-path smoke/published/Cargo.toml
