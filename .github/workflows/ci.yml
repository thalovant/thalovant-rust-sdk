name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      # Limit expensive Argon2 fixtures competing for CPU on smaller runners.
      - run: cargo test --all-features -- --test-threads=2
      - run: cargo package --allow-dirty --list

  minimum-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.88.0"
      # No Cargo.lock is committed, so this job resolves dependencies fresh.
      # Without MSRV-aware resolution it takes the newest release of each,
      # and one that raises its own rust-version past ours (uuid 1.27.0 needs
      # 1.89) fails the job without any change here. "fallback" picks the
      # newest version that still supports `rust-version`, which is what a
      # 1.88 user's Cargo resolves too.
      - run: cargo test --all-targets --all-features -- --test-threads=2
        env:
          CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback

  security:
    name: RustSec dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - run: cargo generate-lockfile
      - run: cargo install cargo-audit --version 0.22.2 --locked --no-default-features
      - run: cargo audit
